<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reson8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .loader { border-top-color: #38bdf8; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root">
        <div class="flex items-center justify-center h-screen">
            <div class="text-center">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto"></div>
                <p class="text-slate-500 animate-pulse">Initializing Reson8...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- Configuration ---
        const RASTER_TIME_US = 10;
        const RASTER_TIME_S = RASTER_TIME_US * 1e-6;
        const DEBOUNCE_MS = 350; // FIX 1: debounce delay for waveform recompute

        const PRESETS = {
            "Nokia Ringtone": "E5:125 D5:125 F#4:250 G#4:250 C#5:125 B4:125 D4:250 E4:250 B4:125 A4:125 C#4:250 E4:250 A4:500 R:500 E5:125 D5:125 F#4:250 G#4:250 C#5:125 B4:125 D4:250 E4:250 B4:125 A4:125 C#4:250 E4:250 A4:500 R:500 E5:125 D5:125 F#4:250 G#4:250 C#5:125 B4:125 D4:250 E4:250 B4:125 A4:125 C#4:250 E4:250 A4:500 R:500 E5:125 D5:125 F#4:250 G#4:250 C#5:125 B4:125 D4:250 E4:250 B4:125 A4:125 C#4:250 E4:250 A4:500",
            "Imperial March": "G4:500 G4:500 G4:500 Eb4:350 Bb4:150 G4:500 Eb4:350 Bb4:150 G4:1000 D5:500 D5:500 D5:500 Eb5:350 Bb4:150 Gb4:500 Eb4:350 Bb4:150 G4:1000 G5:500 G4:350 G4:150 G5:500 F#5:350 F5:150 E5:150 Eb5:150 E5:500 R:250 Ab4:250 Db5:500 C5:350 B4:150 Bb4:150 A4:150 Bb4:500 R:250 Eb4:250 Gb4:500 Eb4:350 Gb4:150 Bb4:500 G4:350 Bb4:150 D5:1000 G5:500 G4:350 G4:150 G5:500 F#5:350 F5:150 E5:150 Eb5:150 E5:500 R:250 Ab4:250 Db5:500 C5:350 B4:150 Bb4:150 A4:150 Bb4:500 R:250 Eb4:250 Gb4:500 Eb4:350 Gb4:150 Bb4:500 G4:350 Bb4:150 D5:1000",
            "Super Mario": "E5:150 E5:150 R:150 E5:150 R:150 C5:150 E5:150 R:150 G5:300 R:300 G4:300 R:300 C5:400 G4:400 E4:400 A4:400 B4:400 Bb4:400 A4:400 G4:250 E5:250 G5:250 A5:400 F5:250 G5:250 E5:400 C5:250 D5:250 B4:400 C5:400 G4:400 E4:400 A4:400 B4:400 Bb4:400 A4:400 G4:250 E5:250 G5:250 A5:400 F5:250 G5:250 E5:400 C5:250 D5:250 B4:400 C5:400 G4:400 E4:400 A4:400 B4:400 Bb4:400 A4:400 G4:250 E5:250 G5:250 A5:400 F5:250 G5:250 E5:400 C5:250 D5:250 B4:400 R:300 E5:150 D5:150 C5:450 R:150 E4:300 R:150 G4:300 R:450 G4:150 A4:300",
            "Sweet Child o' Mine": "D4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 D4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 E4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 E4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 G4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 G4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 D4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 D4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 E4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 E4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 G4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250 G4:250 D5:250 A4:250 G4:250 G5:250 A4:250 F#5:250 A4:250",
            "Mission Impossible": "G4:200 G4:200 Bb4:200 C5:200 G4:200 G4:200 F4:200 F#4:200 G4:200 G4:200 Bb4:200 C5:200 G4:200 G4:200 F4:200 F#4:200 Eb5:600 R:200 D5:600 R:200 Eb5:200 Eb5:200 D5:200 Eb5:200 Bb4:600 R:200 Ab4:600 R:200 Ab4:200 Ab4:200 G4:200 Ab4:200 G4:200 G4:200 Bb4:200 C5:200 G4:200 G4:200 F4:200 F#4:200 G4:200 G4:200 Bb4:200 C5:200 G4:200 G4:200 F4:200 F#4:200 Eb5:600 R:200 D5:600 R:200 Eb5:200 Eb5:200 D5:200 Eb5:200 G5:1000 R:200 G5:1000"
        };

        const noteToFreq = (note) => {
            if (!note || note.toUpperCase() === 'R') return 0;
            const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const octaveMatch = note.match(/\d+$/);
            if (!octaveMatch) return 0;
            const octave = parseInt(octaveMatch[0]);
            const keyStr = note.replace(/\d+$/, '').toUpperCase();
            const key = notes.indexOf(keyStr);
            if (key === -1) return 0;
            const n = key + (octave + 1) * 12;
            return 440 * Math.pow(2, (n - 69) / 12);
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
                Music: <><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></>,
                Settings: <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,
                Play: <path d="m7 4 12 8-12 8V4Z" />,
                Download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z" />,
                Key: <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4M15.5 7.5 14 6M15.5 7.5l-6 6M9.5 13.5l-4 4L2 18l.5-3.5 4-4M9.5 13.5l1.5 1.5" />,
                ChevronDown: <path d="m6 9 6 6 6-6" />
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        // FIX 1: Debounce hook — delays expensive computation until user stops typing
        function useDebounce(value, delay) {
            const [debounced, setDebounced] = useState(value);
            useEffect(() => {
                const timer = setTimeout(() => setDebounced(value), delay);
                return () => clearTimeout(timer);
            }, [value, delay]);
            return debounced;
        }

        function App() {
            const [userKey, setUserKey] = useState("");
            const [showKeyInput, setShowKeyInput] = useState(false);
            const [melodyText, setMelodyText] = useState(PRESETS["Nokia Ringtone"]);
            const [gMax, setGMax] = useState(20);
            const [sMax, setSMax] = useState(120);
            const [waveform, setWaveform] = useState([]);
            const [isPlaying, setIsPlaying] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiPrompt, setAiPrompt] = useState("");
            const [selectedPreset, setSelectedPreset] = useState("Nokia Ringtone");

            const canvasRef = useRef(null);
            const audioCtxRef = useRef(null);
            const rafRef = useRef(null);           // FIX 3: track animation frame
            const playTimerRef = useRef(null);     // FIX 4: track play timeout

            // FIX 1: Debounce melodyText — waveform won't recompute until 350ms after last keypress
            const debouncedMelodyText = useDebounce(melodyText, DEBOUNCE_MS);

            const melodyData = useMemo(() => {
                return debouncedMelodyText.split(/\s+/).filter(Boolean).map(item => {
                    const [note, dur] = item.split(':');
                    return { note, duration: parseInt(dur) || 200, freq: noteToFreq(note) };
                });
            }, [debouncedMelodyText]);

            // Waveform recompute (now only fires after debounce settles)
            useEffect(() => {
                const newWaveform = [];
                melodyData.forEach(({ freq, duration }) => {
                    const numSamples = Math.floor((duration / 1000) / RASTER_TIME_S);
                    const safeAmp = freq > 0 ? Math.min(gMax, (sMax * 1000) / (2 * Math.PI * freq)) : 0;
                    for (let i = 0; i < numSamples; i++) {
                        newWaveform.push(freq > 0 ? safeAmp * Math.sin(2 * Math.PI * freq * (i * RASTER_TIME_S)) : 0);
                    }
                });
                setWaveform(newWaveform);
            }, [melodyData, gMax, sMax]);

            // FIX 2 & 3: Canvas draw — HiDPI-aware, throttled with requestAnimationFrame
            useEffect(() => {
                if (rafRef.current) cancelAnimationFrame(rafRef.current);
                rafRef.current = requestAnimationFrame(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;

                    // FIX 2: Match canvas resolution to device pixel ratio (fixes blur on mobile/retina)
                    const dpr = window.devicePixelRatio || 1;
                    const displayW = canvas.offsetWidth;
                    const displayH = canvas.offsetHeight || 250;
                    if (canvas.width !== displayW * dpr || canvas.height !== displayH * dpr) {
                        canvas.width = displayW * dpr;
                        canvas.height = displayH * dpr;
                        canvas.style.width = displayW + 'px';
                        canvas.style.height = displayH + 'px';
                    }

                    const ctx = canvas.getContext('2d');
                    ctx.scale(dpr, dpr); // scale so drawing coords stay in CSS pixels
                    const W = displayW, H = displayH;

                    ctx.clearRect(0, 0, W, H);
                    const totalSamples = waveform.length;
                    if (totalSamples === 0) return;

                    const centerY = H / 2;
                    const scaleY = (H / 2.5) / (gMax || 1);

                    // Baseline
                    ctx.beginPath(); ctx.strokeStyle = '#334155'; ctx.setLineDash([5, 5]);
                    ctx.moveTo(0, centerY); ctx.lineTo(W, centerY); ctx.stroke();
                    ctx.setLineDash([]);

                    // Note markers + labels
                    let currentSampleOffset = 0;
                    ctx.font = '10px JetBrains Mono';
                    ctx.textAlign = 'center';
                    melodyData.forEach(({ note, duration }) => {
                        const numSamples = Math.floor((duration / 1000) / RASTER_TIME_S);
                        const startX = (currentSampleOffset / totalSamples) * W;
                        const endX = ((currentSampleOffset + numSamples) / totalSamples) * W;
                        const midX = (startX + endX) / 2;
                        ctx.beginPath(); ctx.strokeStyle = '#1e293b';
                        ctx.moveTo(startX, 0); ctx.lineTo(startX, H); ctx.stroke();
                        ctx.fillStyle = '#94a3b8'; ctx.fillText(note, midX, 15);
                        currentSampleOffset += numSamples;
                    });

                    // Waveform line
                    ctx.beginPath(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
                    const step = Math.max(1, Math.floor(totalSamples / W));
                    ctx.moveTo(0, centerY);
                    for (let i = 0; i < W; i++) {
                        const val = waveform[Math.floor(i * step)] || 0;
                        ctx.lineTo(i, centerY - (val * scaleY));
                    }
                    ctx.stroke();
                });
            }, [waveform, gMax, melodyData]);

            // FIX 4: Cleanup audio context and timers on unmount
            useEffect(() => {
                return () => {
                    if (playTimerRef.current) clearTimeout(playTimerRef.current);
                    if (audioCtxRef.current) audioCtxRef.current.close();
                    if (rafRef.current) cancelAnimationFrame(rafRef.current);
                };
            }, []);

            const exportCSV = useCallback(() => {
                let csvContent = "Time (ms),Amplitude (mT/m)\n";
                waveform.forEach((amp, i) => {
                    csvContent += `${(i * RASTER_TIME_US / 1000).toFixed(4)},${amp.toFixed(6)}\n`;
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "reson8_waveform.csv";
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            }, [waveform]);

            const playPreview = useCallback(() => {
                // Lazily create — or resume suspended — AudioContext
                if (!audioCtxRef.current) {
                    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                } else if (audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume();
                }
                const ctx = audioCtxRef.current;
                setIsPlaying(true);
                let time = ctx.currentTime;
                let totalDurationMs = 0;

                melodyData.forEach(({ freq, duration }) => {
                    const durS = duration / 1000;
                    totalDurationMs += duration;
                    if (freq > 0) {
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.frequency.value = freq;
                        g.gain.setValueAtTime(0, time);
                        g.gain.linearRampToValueAtTime(0.1, time + 0.01);
                        g.gain.linearRampToValueAtTime(0, time + durS);
                        osc.connect(g).connect(ctx.destination);
                        osc.start(time); osc.stop(time + durS);
                    }
                    time += durS;
                });

                // FIX 4: Use ref so we can cancel on unmount; suspend ctx after done to save battery
                if (playTimerRef.current) clearTimeout(playTimerRef.current);
                playTimerRef.current = setTimeout(() => {
                    setIsPlaying(false);
                    audioCtxRef.current?.suspend(); // FIX 4: suspend instead of leaving open
                }, totalDurationMs);
            }, [melodyData]);

            const handlePresetChange = (e) => {
                const name = e.target.value;
                setSelectedPreset(name);
                if (PRESETS[name]) setMelodyText(PRESETS[name]);
            };

            const handleAiCompose = async () => {
                if (!userKey) {
                    setShowKeyInput(true);
                    return alert("Please enter your Gemini API Key in the field that appeared below the title.");
                }
                setIsGenerating(true);
                try {
                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${userKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `Compose a short MRI melody for: ${aiPrompt}. Format ONLY as NOTE:MS strings.` }] }],
                                systemInstruction: { parts: [{ text: "Output ONLY notes like C4:250 E4:250. Max 15 notes. No other text." }] }
                            })
                        }
                    );
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) setMelodyText(text.trim());
                    else alert("No output from AI. Try a different prompt.");
                } catch (e) {
                    alert("AI generation failed. Check your API key and network.");
                }
                setIsGenerating(false);
            };

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-10 space-y-8">
                    {/* Header */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                        <div className="flex justify-between items-center">
                            <div className="flex items-center space-x-4">
                                <div className="bg-sky-500 p-3 rounded-xl text-white"><Icon name="Activity" size={28} /></div>
                                <div>
                                    <h1 className="text-xl font-bold">Reson8</h1>
                                    <p className="text-xs text-slate-500 uppercase tracking-widest font-semibold">Pulse Sequence Lab</p>
                                </div>
                            </div>
                            <button
                                onClick={() => setShowKeyInput(v => !v)}
                                className="flex items-center text-xs text-slate-500 hover:text-slate-700 gap-1 border border-slate-200 px-3 py-2 rounded-lg transition-colors"
                            >
                                <Icon name="Key" size={14} /> AI Key <Icon name="ChevronDown" size={12} />
                            </button>
                        </div>
                        {/* FIX 5: API key hidden by default — visible only when technician wants AI */}
                        {showKeyInput && (
                            <div className="flex items-center bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 gap-2">
                                <Icon name="Key" size={14} className="text-slate-400" />
                                <input
                                    type="password"
                                    placeholder="Paste Gemini API Key here (only needed for AI Composer)"
                                    value={userKey}
                                    onChange={(e) => setUserKey(e.target.value)}
                                    className="bg-transparent text-xs outline-none flex-1"
                                />
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div className="space-y-6">
                            {/* Preset selector — works with NO API key */}
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
                                <h3 className="font-bold text-slate-700 flex items-center"><Icon name="Music" size={18} className="mr-2 text-sky-500" /> SEQUENCE</h3>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Preset</label>
                                    <div className="relative">
                                        <select
                                            value={selectedPreset}
                                            onChange={handlePresetChange}
                                            className="w-full appearance-none bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm pr-8 outline-none"
                                        >
                                            {Object.keys(PRESETS).map(name => (
                                                <option key={name} value={name}>{name}</option>
                                            ))}
                                        </select>
                                        <Icon name="ChevronDown" size={14} className="absolute right-2 top-2.5 text-slate-400 pointer-events-none" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Manual edit</label>
                                    <textarea
                                        className="w-full font-mono text-xs p-3 bg-slate-50 border rounded-xl h-32 outline-none"
                                        value={melodyText}
                                        onChange={(e) => setMelodyText(e.target.value)}
                                        placeholder="e.g. C4:250 E4:250 G4:500"
                                    />
                                    <p className="text-[10px] text-slate-400 mt-1">Format: NOTE:ms &nbsp;|&nbsp; R = rest &nbsp;|&nbsp; e.g. C4:250 E4:500</p>
                                </div>
                            </div>

                            {/* AI Composer — clearly optional */}
                            <div className="bg-indigo-600 p-6 rounded-2xl shadow-lg text-white">
                                <h3 className="flex items-center font-bold mb-1 text-sm"><Icon name="Sparkles" size={18} className="mr-2" /> AI COMPOSER</h3>
                                <p className="text-xs text-indigo-200 mb-3">Optional — requires a Gemini API key</p>
                                <textarea
                                    className="w-full bg-white/10 rounded-xl p-3 text-sm h-20 mb-3 border border-white/20 outline-none placeholder-white/50"
                                    placeholder="Describe a mood or scan type..."
                                    value={aiPrompt}
                                    onChange={(e) => setAiPrompt(e.target.value)}
                                />
                                <button
                                    onClick={handleAiCompose}
                                    disabled={isGenerating}
                                    className="w-full py-2 bg-white text-indigo-600 rounded-lg font-bold text-sm hover:bg-indigo-50 disabled:opacity-50 transition-colors"
                                >
                                    {isGenerating ? "Composing..." : "Generate Notes"}
                                </button>
                            </div>
                        </div>

                        <div className="md:col-span-2 space-y-6">
                            <div className="bg-slate-900 p-6 rounded-2xl shadow-2xl">
                                <div className="flex justify-between items-center mb-4 text-[10px] font-bold uppercase tracking-widest">
                                    <span className="text-sky-400">Gradient Output (X/Y)</span>
                                    <span className="text-slate-500">10μs Sample Rate</span>
                                </div>
                                {/* FIX 2: No hardcoded width — canvas sizes itself via JS to match display */}
                                <canvas ref={canvasRef} style={{width:'100%', height:'250px', display:'block'}} />
                                <div className="flex justify-center mt-6 space-x-4">
                                    <button
                                        onClick={playPreview}
                                        disabled={isPlaying}
                                        className={`bg-sky-500 text-white px-6 py-3 rounded-xl font-bold flex items-center transition-all shadow-lg shadow-sky-500/20 ${isPlaying ? "opacity-50 cursor-not-allowed" : "hover:bg-sky-400"}`}
                                    >
                                        <Icon name="Play" className="mr-2" /> {isPlaying ? "PLAYING..." : "PREVIEW SOUND"}
                                    </button>
                                    <button
                                        onClick={exportCSV}
                                        className="bg-slate-700 text-white px-6 py-3 rounded-xl font-bold flex items-center hover:bg-slate-600 transition-colors"
                                    >
                                        <Icon name="Download" className="mr-2" /> EXPORT CSV
                                    </button>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-white p-4 rounded-xl border border-slate-200">
                                    <label className="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Max Grad (mT/m)</label>
                                    <input type="range" min="5" max="40" value={gMax} onChange={(e) => setGMax(parseInt(e.target.value))} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-500" />
                                    <div className="text-right font-bold text-slate-700 mt-1">{gMax}</div>
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200">
                                    <label className="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Max Slew (T/m/s)</label>
                                    <input type="range" min="50" max="200" step="10" value={sMax} onChange={(e) => setSMax(parseInt(e.target.value))} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-500" />
                                    <div className="text-right font-bold text-slate-700 mt-1">{sMax}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
