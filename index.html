<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reson8</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .loader { border-top-color: #38bdf8; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root">
        <div class="flex items-center justify-center h-screen">
            <div class="text-center">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto"></div>
                <p class="text-slate-500 animate-pulse">Initializing Reson8...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const RASTER_TIME_US = 10;
        const RASTER_TIME_S = RASTER_TIME_US * 1e-6;

        const PRESETS = {
            "Nokia Ringtone": "E5:125 D5:125 F#4:250 G#4:250 C#5:125 B4:125 D4:250 E4:250 B4:125 A4:125 C#4:250 E4:250 A4:500",
            "Imperial March": "G4:500 R:50 G4:500 R:50 G4:500 R:50 E4:375 A#4:125 G4:500 R:50 E4:375 A#4:125 G4:1000",
            "Super Mario": "E5:125 R:125 E5:125 R:125 E5:125 R:125 C5:125 E5:250 G5:250 R:250 G4:250"
        };

        const noteToFreq = (note) => {
            if (!note || note.toUpperCase() === 'R') return 0;
            const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const octaveMatch = note.match(/\d+$/);
            if (!octaveMatch) return 0;
            const octave = parseInt(octaveMatch[0]);
            const keyStr = note.replace(/\d+$/, '').toUpperCase();
            const key = notes.indexOf(keyStr);
            if (key === -1) return 0;
            const n = key + (octave + 1) * 12;
            return 440 * Math.pow(2, (n - 69) / 12);
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
                Music: <><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></>,
                Settings: <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,
                Play: <path d="m7 4 12 8-12 8V4Z" />,
                Download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z" />,
                Key: <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4M15.5 7.5 14 6M15.5 7.5l-6 6M9.5 13.5l-4 4L2 18l.5-3.5 4-4M9.5 13.5l1.5 1.5" />
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        function App() {
            const [userKey, setUserKey] = useState("");
            const [melodyText, setMelodyText] = useState(PRESETS["Nokia Ringtone"]);
            const [gMax, setGMax] = useState(20);
            const [sMax, setSMax] = useState(120);
            const [waveform, setWaveform] = useState([]);
            const [isPlaying, setIsPlaying] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiPrompt, setAiPrompt] = useState("");

            const canvasRef = useRef(null);
            const audioCtxRef = useRef(null);

            const melodyData = useMemo(() => {
                return melodyText.split(/\s+/).filter(Boolean).map(item => {
                    const [note, dur] = item.split(':');
                    return { note, duration: parseInt(dur) || 200, freq: noteToFreq(note) };
                });
            }, [melodyText]);

            useEffect(() => {
                const newWaveform = [];
                melodyData.forEach(({ freq, duration }) => {
                    const numSamples = Math.floor((duration / 1000) / RASTER_TIME_S);
                    const safeAmp = freq > 0 ? Math.min(gMax, (sMax * 1000) / (2 * Math.PI * freq)) : 0;
                    for (let i = 0; i < numSamples; i++) {
                        newWaveform.push(freq > 0 ? safeAmp * Math.sin(2 * Math.PI * freq * (i * RASTER_TIME_S)) : 0);
                    }
                });
                setWaveform(newWaveform);
            }, [melodyData, gMax, sMax]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const totalSamples = waveform.length;
                if (totalSamples === 0) return;

                const centerY = canvas.height / 2;
                const scaleY = (canvas.height / 2.5) / (gMax || 1);
                
                // Draw Axis
                ctx.beginPath();
                ctx.strokeStyle = '#334155';
                ctx.setLineDash([5, 5]);
                ctx.moveTo(0, centerY);
                ctx.lineTo(canvas.width, centerY);
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw Note Labels and Dividers
                let currentSampleOffset = 0;
                ctx.font = '10px JetBrains Mono';
                ctx.textAlign = 'center';
                
                melodyData.forEach(({ note, duration }) => {
                    // Calculate where the note starts and ends on the canvas width
                    const numSamples = Math.floor((duration / 1000) / RASTER_TIME_S);
                    const startX = (currentSampleOffset / totalSamples) * canvas.width;
                    const endX = ((currentSampleOffset + numSamples) / totalSamples) * canvas.width;
                    const midX = (startX + endX) / 2;

                    // Draw the vertical divider line
                    ctx.beginPath();
                    ctx.strokeStyle = '#1e293b';
                    ctx.moveTo(startX, 0);
                    ctx.lineTo(startX, canvas.height);
                    ctx.stroke();

                    // Draw the note label (e.g., "E5")
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillText(note, midX, 15);

                    currentSampleOffset += numSamples;
                });

                // Draw Waveform
                ctx.beginPath(); 
                ctx.strokeStyle = '#38bdf8'; 
                ctx.lineWidth = 2;
                const step = Math.max(1, Math.floor(waveform.length / canvas.width));
                ctx.moveTo(0, centerY);
                for (let i = 0; i < canvas.width; i++) {
                    const val = waveform[Math.floor(i * step)] || 0;
                    ctx.lineTo(i, centerY - (val * scaleY));
                }
                ctx.stroke();
            }, [waveform, gMax, melodyData]);

            const exportCSV = () => {
                let csvContent = "Time (ms),Amplitude (mT/m)\n";
                waveform.forEach((amp, i) => {
                    csvContent += `${(i * RASTER_TIME_US / 1000).toFixed(4)},${amp.toFixed(6)}\n`;
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "reson8_waveform.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const playPreview = () => {
                if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                const ctx = audioCtxRef.current;
                setIsPlaying(true);
                let time = ctx.currentTime;
                melodyData.forEach(({ freq, duration }) => {
                    const durS = duration / 1000;
                    if (freq > 0) {
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.frequency.value = freq;
                        g.gain.setValueAtTime(0, time);
                        g.gain.linearRampToValueAtTime(0.1, time + 0.01);
                        g.gain.linearRampToValueAtTime(0, time + durS);
                        osc.connect(g).connect(ctx.destination);
                        osc.start(time); osc.stop(time + durS);
                    }
                    time += durS;
                });
                setTimeout(() => setIsPlaying(false), (time - ctx.currentTime) * 1000);
            };

            const handleAiCompose = async () => {
                if (!userKey) return alert("Please enter a Gemini API Key first.");
                setIsGenerating(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${userKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Compose a short MRI melody for: ${aiPrompt}. Format ONLY as NOTE:MS strings.` }] }],
                            systemInstruction: { parts: [{ text: "Output ONLY notes like C4:250 E4:250. Max 15 notes." }] }
                        })
                    });
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) setMelodyText(text.trim());
                } catch (e) { alert("AI Generation failed. Check key."); }
                setIsGenerating(false);
            };

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-10 space-y-8">
                    <div className="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex items-center space-x-4">
                            <div className="bg-sky-500 p-3 rounded-xl text-white"><Icon name="Activity" size={28} /></div>
                            <div>
                                <h1 className="text-xl font-bold">Reson8</h1>
                                <p className="text-xs text-slate-500 uppercase tracking-widest font-semibold">Pulse Sequence Lab</p>
                            </div>
                        </div>
                        <div className="flex items-center bg-slate-100 p-2 rounded-lg border border-slate-200">
                            <Icon name="Key" size={16} className="text-slate-400 mx-2" />
                            <input type="password" placeholder="Gemini API Key" value={userKey} onChange={(e) => setUserKey(e.target.value)} className="bg-transparent text-xs outline-none w-32 md:w-48"/>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div className="space-y-6">
                            <div className="bg-indigo-600 p-6 rounded-2xl shadow-lg text-white">
                                <h3 className="flex items-center font-bold mb-4 text-sm"><Icon name="Sparkles" size={18} className="mr-2" /> AI COMPOSER</h3>
                                <textarea className="w-full bg-white/10 rounded-xl p-3 text-sm h-24 mb-3 border border-white/20 outline-none" placeholder="Describe a mood..." value={aiPrompt} onChange={(e) => setAiPrompt(e.target.value)} />
                                <button onClick={handleAiCompose} disabled={isGenerating} className="w-full py-2 bg-white text-indigo-600 rounded-lg font-bold text-sm hover:bg-indigo-50 disabled:opacity-50">
                                    {isGenerating ? "Composing..." : "Generate Notes"}
                                </button>
                            </div>
                            <div className="bg-white p-6 rounded-2xl border border-slate-200">
                                <h3 className="font-bold text-slate-700 flex items-center mb-4"><Icon name="Music" size={18} className="mr-2 text-sky-500" /> SEQUENCE</h3>
                                <textarea className="w-full font-mono text-xs p-3 bg-slate-50 border rounded-xl h-32 outline-none" value={melodyText} onChange={(e) => setMelodyText(e.target.value)} />
                            </div>
                        </div>

                        <div className="md:col-span-2 space-y-6">
                            <div className="bg-slate-900 p-6 rounded-2xl shadow-2xl">
                                <div className="flex justify-between items-center mb-4 text-[10px] font-bold uppercase tracking-widest">
                                    <span className="text-sky-400">Gradient Output (X/Y)</span>
                                    <span className="text-slate-500">10μs Sample Rate</span>
                                </div>
                                <canvas ref={canvasRef} width={800} height={250} className="w-full" />
                                <div className="flex justify-center mt-6 space-x-4">
                                    <button onClick={playPreview} className="bg-sky-500 text-white px-6 py-3 rounded-xl font-bold flex items-center hover:bg-sky-400 shadow-lg shadow-sky-500/20">
                                        <Icon name="Play" className="mr-2" /> PREVIEW SOUND
                                    </button>
                                    <button onClick={exportCSV} className="bg-slate-700 text-white px-6 py-3 rounded-xl font-bold flex items-center hover:bg-slate-600">
                                        <Icon name="Download" className="mr-2" /> EXPORT CSV
                                    </button>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-white p-4 rounded-xl border border-slate-200">
                                    <label className="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Max Grad (mT/m)</label>
                                    <input type="range" min="5" max="40" value={gMax} onChange={(e) => setGMax(parseInt(e.target.value))} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-500" />
                                    <div className="text-right font-bold text-slate-700 mt-1">{gMax}</div>
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200">
                                    <label className="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Max Slew (T/m/s)</label>
                                    <input type="range" min="50" max="200" step="10" value={sMax} onChange={(e) => setSMax(parseInt(e.target.value))} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-500" />
                                    <div className="text-right font-bold text-slate-700 mt-1">{sMax}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
