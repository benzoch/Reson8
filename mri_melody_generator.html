<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Melody Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide CDN often requires manual component initialization in this environment -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        input[type="range"] { cursor: pointer; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Gemini API Integration Constants ---
        const apiKey = ""; // Environment provides the key
        const GEN_MODEL = "gemini-2.5-flash-preview-09-2025";
        const TTS_MODEL = "gemini-2.5-flash-preview-tts";

        const RASTER_TIME_US = 10;
        const RASTER_TIME_S = RASTER_TIME_US * 1e-6;

        const PRESETS = {
            "Nokia Ringtone": "E5:125 D5:125 F#4:250 G#4:250 C#5:125 B4:125 D4:250 E4:250 B4:125 A4:125 C#4:250 E4:250 A4:500",
            "Imperial March": "G4:500 R:50 G4:500 R:50 G4:500 R:50 E4:375 A#4:125 G4:500 R:50 E4:375 A#4:125 G4:1000",
            "Super Mario": "E5:125 R:125 E5:125 R:125 E5:125 R:125 C5:125 E5:250 G5:250 R:250 G4:250",
            "Beethoven 5th": "G4:200 G4:200 G4:200 D#4:800 R:400 F4:200 F4:200 F4:200 D4:800",
            "Custom": "C4:200 D4:200 E4:200 F4:200 G4:200 A4:200 B4:200 C5:400"
        };

        const noteToFreq = (note) => {
            if (!note || note.toUpperCase() === 'R') return 0;
            const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const octaveMatch = note.match(/\d+$/);
            if (!octaveMatch) return 0;
            const octave = parseInt(octaveMatch[0]);
            const keyStr = note.replace(/\d+$/, '').toUpperCase();
            const key = notes.indexOf(keyStr);
            if (key === -1) return 0;
            const n = key + (octave + 1) * 12;
            return 440 * Math.pow(2, (n - 69) / 12);
        };

        // Fallback Icon component using SVG strings to avoid React Error #130 with external objects
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
                Info: <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z" />,
                Music: <><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></>,
                Settings: <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>,
                Play: <path d="m7 4 12 8-12 8V4Z" />,
                FileText: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></>,
                Download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>,
                AlertTriangle: <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/>,
                Volume2: <><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></>,
                Wand2: <><path d="m2 21 21-21"/><path d="M14 7h.01"/><path d="M9 11h.01"/><path d="M15 12h.01"/><path d="M12 15h.01"/><path d="M20 9h.01"/></>,
                Loader2: <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            };

            return (
                <svg
                    width={size}
                    height={size}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        function App() {
            const [activePreset, setActivePreset] = useState("Nokia Ringtone");
            const [melodyText, setMelodyText] = useState(PRESETS["Nokia Ringtone"]);
            const [gMax, setGMax] = useState(20);
            const [sMax, setSMax] = useState(120);
            const [waveform, setWaveform] = useState([]);
            const [isPlaying, setIsPlaying] = useState(false);
            const [showInstructions, setShowInstructions] = useState(false);
            
            const [aiPrompt, setAiPrompt] = useState("");
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiReport, setAiReport] = useState("");
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);

            const canvasRef = useRef(null);
            const audioCtxRef = useRef(null);

            const callGemini = async (model, payload, retries = 5, delay = 1000) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('API Error');
                    return await response.json();
                } catch (error) {
                    if (retries > 0) {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return callGemini(model, payload, retries - 1, delay * 2);
                    }
                    throw error;
                }
            };

            const handleComposeWithAI = async () => {
                if (!aiPrompt.trim()) return;
                setIsGenerating(true);
                try {
                    const result = await callGemini(GEN_MODEL, {
                        contents: [{ parts: [{ text: `Compose a short MRI-friendly melody based on this description: ${aiPrompt}. Keep it under 20 notes.` }] }],
                        systemInstruction: { parts: [{ text: "You are an MRI musical sequence composer. Your job is to output ONLY a string of musical notes in the format NOTE:DURATION(ms) separated by spaces. Example: C4:250 E4:250 G4:500. Use R for rests." }] }
                    });
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        setMelodyText(text.trim());
                        setActivePreset("Custom");
                        setAiPrompt("");
                    }
                } catch (error) { console.error(error); }
                finally { setIsGenerating(false); }
            };

            const handleAnalyzeMelody = async () => {
                setIsAnalyzing(true);
                try {
                    const result = await callGemini(GEN_MODEL, {
                        contents: [{ parts: [{ text: `Analyze this MRI gradient melody sequence: "${melodyText}". Parameters: Gmax=${gMax}mT/m, Smax=${sMax}T/m/s. Provide a brief 3-sentence summary.` }] }],
                    });
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) setAiReport(text);
                } catch (error) { console.error(error); }
                finally { setIsAnalyzing(false); }
            };

            const handleSpeakReport = async () => {
                if (!aiReport || isSpeaking) return;
                setIsSpeaking(true);
                try {
                    const result = await callGemini(TTS_MODEL, {
                        contents: [{ parts: [{ text: `Summarize this report: ${aiReport}` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                        }
                    });
                    const base64Audio = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                    if (base64Audio) {
                        const audioData = atob(base64Audio);
                        const arrayBuffer = new ArrayBuffer(audioData.length);
                        const view = new Uint8Array(arrayBuffer);
                        for (let i = 0; i < audioData.length; i++) view[i] = audioData.charCodeAt(i);
                        const wavBlob = createWavBlob(arrayBuffer, 24000);
                        const audio = new Audio(URL.createObjectURL(wavBlob));
                        audio.onended = () => setIsSpeaking(false);
                        audio.play();
                    }
                } catch (error) { 
                    console.error(error); 
                    setIsSpeaking(false); 
                }
            };

            const createWavBlob = (pcmBuffer, sampleRate) => {
                const buffer = new ArrayBuffer(44 + pcmBuffer.byteLength);
                const view = new DataView(buffer);
                const writeString = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
                writeString(0, 'RIFF');
                view.setUint32(4, 36 + pcmBuffer.byteLength, true);
                writeString(8, 'WAVE'); writeString(12, 'fmt ');
                view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
                view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true); view.setUint16(34, 16, true);
                writeString(36, 'data'); view.setUint32(40, pcmBuffer.byteLength, true);
                new Uint8Array(buffer, 44).set(new Uint8Array(pcmBuffer));
                return new Blob([view], { type: 'audio/wav' });
            };

            const melodyData = useMemo(() => {
                return melodyText.split(/\s+/).filter(Boolean).map(item => {
                    const parts = item.split(':');
                    const note = parts[0];
                    const dur = parts[1];
                    return { note, duration: parseInt(dur) || 200, freq: noteToFreq(note) };
                });
            }, [melodyText]);

            useEffect(() => {
                const newWaveform = [];
                melodyData.forEach(({ freq, duration }) => {
                    const numSamples = Math.floor((duration / 1000) / RASTER_TIME_S);
                    const safeAmp = freq > 0 ? Math.min(gMax, (sMax * 1000) / (2 * Math.PI * freq)) : 0;
                    for (let i = 0; i < numSamples; i++) {
                        newWaveform.push(freq > 0 ? safeAmp * Math.sin(2 * Math.PI * freq * (i * RASTER_TIME_S)) : 0);
                    }
                });
                setWaveform(newWaveform);
            }, [melodyData, gMax, sMax]);

            useEffect(() => {
                if (!canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (waveform.length === 0) return;

                ctx.beginPath();
                ctx.strokeStyle = '#0ea5e9';
                ctx.lineWidth = 2;
                const step = Math.max(1, Math.floor(waveform.length / canvas.width));
                const centerY = canvas.height / 2;
                const scaleY = (canvas.height / 2) / (gMax || 1);
                
                ctx.moveTo(0, centerY);
                for (let i = 0; i < canvas.width; i++) {
                    const val = waveform[Math.floor(i * step)] || 0;
                    ctx.lineTo(i, centerY - (val * scaleY));
                }
                ctx.stroke();
            }, [waveform, gMax]);

            const playPreview = () => {
                if (isPlaying) return;
                try {
                    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    const ctx = audioCtxRef.current;
                    if (ctx.state === 'suspended') ctx.resume();
                    
                    setIsPlaying(true);
                    let time = ctx.currentTime;
                    
                    melodyData.forEach(({ freq, duration }) => {
                        const durS = duration / 1000;
                        if (freq > 0) {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.value = freq;
                            gain.gain.setValueAtTime(0, time);
                            gain.gain.linearRampToValueAtTime(0.1, time + 0.01);
                            gain.gain.linearRampToValueAtTime(0, time + durS);
                            osc.connect(gain).connect(ctx.destination);
                            osc.start(time); osc.stop(time + durS);
                        }
                        time += durS;
                    });
                    
                    setTimeout(() => setIsPlaying(false), (time - ctx.currentTime) * 1000);
                } catch (e) {
                    console.error("Audio error", e);
                    setIsPlaying(false);
                }
            };

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
                    <header className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center space-x-4">
                            <div className="p-3 bg-sky-100 text-sky-600 rounded-xl">
                                <Icon name="Activity" size={32} />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold">MRI Melody Generator</h1>
                                <p className="text-slate-500 text-sm">Gradient Pulse Audio Synthesis</p>
                            </div>
                        </div>
                        <button onClick={() => setShowInstructions(true)} className="flex items-center px-4 py-2 text-sm bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">
                            <Icon name="Info" size={16} className="mr-2" /> Scanner Instructions
                        </button>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        <div className="lg:col-span-4 space-y-6">
                            <div className="bg-gradient-to-br from-indigo-600 to-violet-700 p-6 rounded-2xl shadow-lg text-white">
                                <div className="flex items-center mb-4 font-bold">
                                    <Icon name="Sparkles" size={20} className="mr-2 text-yellow-300" /> AI Composer
                                </div>
                                <textarea 
                                    value={aiPrompt} 
                                    onChange={e => setAiPrompt(e.target.value)} 
                                    placeholder="Describe a melody (e.g., 'Fast upbeat jazz' or 'Slow lullaby')..." 
                                    className="w-full p-3 bg-white/10 border border-white/20 rounded-xl mb-3 text-sm h-24 resize-none outline-none focus:ring-2 focus:ring-white/50 placeholder-white/40" 
                                />
                                <button onClick={handleComposeWithAI} disabled={isGenerating || !aiPrompt} className="w-full py-2.5 bg-white text-indigo-700 rounded-xl font-bold flex justify-center items-center hover:bg-indigo-50 disabled:opacity-50 transition-all">
                                    {isGenerating ? <Icon name="Loader2" className="animate-spin mr-2" size={18} /> : <Icon name="Wand2" className="mr-2" size={18} />} Generate
                                </button>
                            </div>

                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                <div className="flex items-center font-semibold text-slate-700">
                                    <Icon name="Music" size={20} className="mr-2 text-sky-500" /> Melody Editor
                                </div>
                                <select 
                                    value={activePreset} 
                                    onChange={e => { setActivePreset(e.target.value); setMelodyText(PRESETS[e.target.value]); }} 
                                    className="w-full p-2 border rounded-lg bg-slate-50 text-sm outline-none"
                                >
                                    {Object.keys(PRESETS).map(k => <option key={k} value={k}>{k}</option>)}
                                </select>
                                <textarea 
                                    value={melodyText} 
                                    onChange={e => { setMelodyText(e.target.value); setActivePreset("Custom"); }} 
                                    rows="4" 
                                    className="w-full p-3 border rounded-lg font-mono text-xs bg-slate-50 outline-none" 
                                    spellCheck="false" 
                                />
                                <p className="text-[10px] text-slate-400">Format: NOTE:DURATION(ms) ... (e.g. C4:500 R:250 E4:500)</p>
                            </div>

                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                                <div className="flex items-center font-semibold text-slate-700">
                                    <Icon name="Settings" size={20} className="mr-2 text-sky-500" /> Scanner Limits
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-500 block mb-2">Max Gradient: {gMax} mT/m</label>
                                    <input type="range" min="1" max="40" value={gMax} onChange={e => setGMax(Number(e.target.value))} className="w-full accent-sky-500" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-500 block mb-2">Max Slew: {sMax} T/m/s</label>
                                    <input type="range" min="50" max="200" step="10" value={sMax} onChange={e => setSMax(Number(e.target.value))} className="w-full accent-sky-500" />
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-8 space-y-6">
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="font-semibold text-slate-700">Gradient Waveform</h2>
                                    <div className="flex gap-2">
                                        <span className="px-2 py-1 bg-sky-100 text-sky-700 text-[10px] font-bold rounded-full">10µs Raster</span>
                                    </div>
                                </div>
                                <div className="bg-slate-900 rounded-xl p-4 shadow-inner overflow-hidden">
                                    <canvas ref={canvasRef} width={1000} height={300} className="w-full h-auto block" />
                                </div>
                                <div className="mt-6 flex flex-wrap justify-center gap-4">
                                    <button onClick={playPreview} disabled={isPlaying} className="px-6 py-2 bg-sky-600 text-white rounded-xl font-bold flex items-center hover:bg-sky-500 disabled:opacity-50 transition-colors">
                                        {isPlaying ? <Icon name="Loader2" className="animate-spin mr-2" size={18} /> : <Icon name="Play" className="mr-2" size={18} />} Audio Preview
                                    </button>
                                    <button onClick={handleAnalyzeMelody} disabled={isAnalyzing} className="px-6 py-2 bg-slate-800 text-white rounded-xl font-bold flex items-center hover:bg-slate-700 disabled:opacity-50 transition-colors">
                                        {isAnalyzing ? <Icon name="Loader2" className="animate-spin mr-2" size={18} /> : <Icon name="FileText" className="mr-2" size={18} />} Analyze Sequence
                                    </button>
                                </div>
                            </div>

                            {aiReport && (
                                <div className="bg-sky-50 border border-sky-200 p-6 rounded-2xl relative animate-in fade-in slide-in-from-bottom-2 duration-300">
                                    <div className="flex justify-between items-center mb-2">
                                        <div className="flex items-center text-sky-900 font-bold text-xs uppercase tracking-wider">
                                            <Icon name="Sparkles" size={14} className="mr-2" /> AI Report
                                        </div>
                                        <button onClick={handleSpeakReport} disabled={isSpeaking} className="px-3 py-1 bg-sky-600 text-white text-[10px] font-bold rounded-full flex items-center hover:bg-sky-500 disabled:opacity-50 transition-all">
                                            {isSpeaking ? <Icon name="Loader2" className="animate-spin mr-1" size={12} /> : <Icon name="Volume2" className="mr-1" size={12} />} Listen
                                        </button>
                                    </div>
                                    <p className="text-sky-800 text-sm leading-relaxed">{aiReport}</p>
                                </div>
                            )}

                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-4">
                                <button className="flex items-center p-4 border rounded-xl hover:bg-slate-50 transition-all group">
                                    <Icon name="Download" size={24} className="text-slate-400 group-hover:text-sky-500 mr-4 transition-colors" />
                                    <div className="text-left">
                                        <div className="font-bold text-sm text-slate-700">Siemens TXT</div>
                                        <div className="text-[10px] text-slate-500 tracking-tight">Normalized Gradient Array</div>
                                    </div>
                                </button>
                                <button className="flex items-center p-4 border rounded-xl hover:bg-slate-50 transition-all group">
                                    <Icon name="Download" size={24} className="text-slate-400 group-hover:text-sky-500 mr-4 transition-colors" />
                                    <div className="text-left">
                                        <div className="font-bold text-sm text-slate-700">Raw CSV</div>
                                        <div className="text-[10px] text-slate-500 tracking-tight">Time-Amplitude Values</div>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>

                    {showInstructions && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl relative animate-in zoom-in duration-200">
                                <h3 className="text-xl font-bold mb-4">Scanner Integration</h3>
                                <p className="text-sm text-slate-600 leading-relaxed mb-6">
                                    MRI scanners produce sound via Lorentz forces on gradient coils. To "play" this melody, load the exported TXT file into a research sequence (e.g., WIP 711) using a 10µs dwell time.
                                </p>
                                <div className="bg-amber-50 p-4 rounded-xl flex gap-3 text-amber-900 border border-amber-100 mb-6">
                                    <Icon name="AlertTriangle" size={20} className="shrink-0 text-amber-600" />
                                    <p className="text-xs leading-snug font-medium">
                                        Safety Check: Always verify slew rate limits on a phantom before human scanning. Sequence acoustics can exceed 100dB in clinical environments.
                                    </p>
                                </div>
                                <button onClick={() => setShowInstructions(false)} className="w-full py-3 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-700 transition-all">Close</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
